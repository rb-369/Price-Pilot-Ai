[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=services --cov=routes --cov=evaluation --cov-report=term-missing
asyncio_mode = auto

# Run evaluation suite separately:
#   python -m evaluation.run_all
#   python -m evaluation.run_all --skip-chatbot --skip-forecasting
